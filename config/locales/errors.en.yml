# Messages for the app's own validation error codes. The forms show their own
# copy, in the Client's language, for the codes they know; these messages are
# the server's fallback.
en:
  activerecord:
    errors:
      models:
        break_period:
          attributes:
            ends_on:
              on_or_after_start: "must be on or after the start date"
        class_group:
          attributes:
            base:
              clash: "would overlap in time with another Class of the Coach or of a Player"
            coach:
              not_a_coach: "must be a Coach"
            level:
              no_modules: "has no Modules in its Course yet"
            players:
              too_many: "is too many (maximum is %{count})"
              other_club: "must all belong to the Coach's Club"
            weekdays:
              cadence_mismatch: "must be one distinct weekday per weekly Class"
        coach_invitation:
          attributes:
            email:
              account_exists: "already has an account"
        user:
          attributes:
            email:
              account_exists: "already has an account"
