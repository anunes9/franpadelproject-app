# Messages for the app's own validation error codes. The forms show their own
# copy, in the Client's language, for the codes they know; these messages are
# the server's fallback.
en:
  activerecord:
    errors:
      models:
        break_period:
          attributes:
            ends_on:
              on_or_after_start: "must be on or after the start date"
        class_group:
          attributes:
            base:
              clash: "would overlap in time with another Class of the Coach or of a Player"
              not_saved: "could not be saved, so nothing was created"
              plan_complete: "has completed every Module of its Course, so there are no Classes to regenerate"
            duration:
              crosses_midnight: "must let every Class end by midnight"
            coach:
              not_a_coach: "must be a Coach"
              other_club: "must be a Coach of the group's Club"
              removed: "was removed from the Club"
            level:
              no_modules: "has no Modules in its Course yet"
              not_next_level: "is not the Level after the group it continues"
            start_time:
              crosses_midnight: "must let the Class end by midnight"
            players:
              too_many: "is too many (maximum is %{count})"
              other_club: "must all belong to the Coach's Club"
            weekdays:
              cadence_mismatch: "must be one distinct weekday per weekly Class"
        coach_invitation:
          attributes:
            email:
              account_exists: "already has an account"
        training_class:
          attributes:
            base:
              clash: "would overlap in time with another Class of the Coach or of a Player"
            course_module:
              other_course: "must be a Module of the group's Course"
            done:
              skipped: "cannot be marked for a skipped Class"
            skipped:
              done: "cannot be marked for a done Class"
            start_time:
              crosses_midnight: "must let the Class end by midnight"
        training_class_exercise:
          attributes:
            exercise:
              other_module: "must be an Exercise of the Class's Module"
        user:
          attributes:
            base:
              has_class_groups: "owns Class Groups, so reassign them to another Coach first"
            email:
              account_exists: "already has an account"
