# Mensagens para os códigos de erro de validação da própria app. Os
# formulários mostram o seu próprio texto, na língua do Cliente, para os
# códigos que conhecem; estas mensagens são o recurso do servidor.
pt:
  activerecord:
    errors:
      models:
        board:
          attributes:
            document:
              too_large: "é demasiado grande para guardar"
        break_period:
          attributes:
            ends_on:
              on_or_after_start: "tem de ser igual ou posterior à data de início"
        class_group:
          attributes:
            base:
              clash: "sobrepõe-se no tempo a outra aula do treinador ou de um jogador"
              not_saved: "não foi possível guardar, por isso nada foi criado"
              plan_complete: "já concluiu todos os mesociclos do curso, por isso não há aulas a regenerar"
            duration:
              crosses_midnight: "tem de permitir que todas as aulas terminem até à meia-noite"
            coach:
              not_a_coach: "tem de ser um treinador"
              other_club: "tem de ser um treinador do clube do grupo"
              removed: "foi removido do clube"
            level:
              no_modules: "ainda não tem mesociclos no seu curso"
              not_next_level: "não é o nível seguinte ao do grupo que continua"
            start_time:
              crosses_midnight: "tem de permitir que a aula termine até à meia-noite"
            players:
              too_many: "são demasiados (o máximo é %{count})"
              other_club: "têm de pertencer todos ao clube do treinador"
            weekdays:
              cadence_mismatch: "tem de ter um dia da semana diferente por cada aula semanal"
        course_module:
          attributes:
            strokes:
              unknown: "tem golpes que não estão na lista: %{strokes}"
        coach_invitation:
          attributes:
            email:
              account_exists: "já tem uma conta"
        evaluation:
          attributes:
            base:
              not_assessment: "só pode ser registada numa aula de avaliação"
              skipped: "não pode ser registada numa aula saltada"
              not_yet: "só pode ser registada a partir da data da aula"
            player:
              not_in_group: "tem de ser um jogador do grupo da aula"
        training_class:
          attributes:
            base:
              clash: "sobrepõe-se no tempo a outra aula do treinador ou de um jogador"
            course_module:
              other_course: "tem de ser um mesociclo do curso do grupo"
            done:
              skipped: "não pode ser marcado numa aula saltada"
              evaluated: "tem de continuar marcado enquanto a aula tiver avaliações de jogadores"
            skipped:
              done: "não pode ser marcado numa aula feita"
              evaluated: "não pode ser marcado enquanto a aula tiver avaliações de jogadores"
            start_time:
              crosses_midnight: "tem de permitir que a aula termine até à meia-noite"
        training_class_exercise:
          attributes:
            exercise:
              other_module: "tem de ser um exercício do mesociclo da aula"
        user:
          attributes:
            base:
              has_class_groups: "tem grupos de aulas, por isso reatribua-os primeiro a outro treinador"
            email:
              account_exists: "já tem uma conta"
